<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Corruption order changes the bias scale</title>
  <desc id="desc">CTL corruption before privacy gives bias at most 2 alpha. LTC privacy before corruption gives bias at most 2 c alpha. Squaring these mean errors yields alpha squared and c squared alpha squared in square loss.</desc>
  <rect width="1200" height="590" fill="#f7f5ef"/>
  <text x="64" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17212b">Order changes where the privacy amplification lands</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="20" fill="#51606e">Exact expectation calculation for every h,b∈[-1,1]</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="155" width="500" height="285" rx="18" fill="#e5f1ee" stroke="#146c5c" stroke-width="3"/>
    <text x="320" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#146c5c">CTL</text>
    <text x="320" y="243" text-anchor="middle" font-size="19" fill="#17212b">corrupt → randomized response → de-privatize</text>
    <text x="320" y="301" text-anchor="middle" font-size="24" fill="#17212b">F = (1−α)h + αb</text>
    <text x="320" y="352" text-anchor="middle" font-size="27" font-weight="700" fill="#146c5c">bias ≤ 2α</text>
    <text x="320" y="397" text-anchor="middle" font-size="20" fill="#51606e">square-loss contribution: α²</text>
    <rect x="630" y="155" width="500" height="285" rx="18" fill="#f6e9e5" stroke="#a13d2d" stroke-width="3"/>
    <text x="880" y="205" text-anchor="middle" font-size="28" font-weight="700" fill="#a13d2d">LTC</text>
    <text x="880" y="243" text-anchor="middle" font-size="19" fill="#17212b">randomized response → corrupt → de-privatize</text>
    <text x="880" y="301" text-anchor="middle" font-size="24" fill="#17212b">F = (1−α)h + αcb</text>
    <text x="880" y="352" text-anchor="middle" font-size="27" font-weight="700" fill="#a13d2d">bias ≤ 2cα</text>
    <text x="880" y="397" text-anchor="middle" font-size="20" fill="#51606e">square-loss contribution: c²α²</text>
    <text x="600" y="500" text-anchor="middle" font-size="22" font-weight="700" fill="#17212b">Endpoint adversaries attain both orders up to universal constants</text>
    <text x="600" y="538" text-anchor="middle" font-size="18" fill="#51606e">The historical “c² bias ratio” mixed up mean bias with squared error.</text>
  </g>
</svg>
