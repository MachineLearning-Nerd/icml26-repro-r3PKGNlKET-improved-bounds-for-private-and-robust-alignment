<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Claim-by-claim reproduction outcomes</title>
  <desc id="desc">Claims 1, 2, 3, 4, and 6 are verified. Claim 5 is falsified because its broad novelty conjunct has a prior counterexample, while its rate subclaim verifies.</desc>
  <rect width="1200" height="560" fill="#f7f5ef"/>
  <text x="64" y="76" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#17212b">Six exact claim contracts, six decisive verdicts</text>
  <text x="64" y="114" font-family="Arial, sans-serif" font-size="20" fill="#51606e">Proof certificates or an assumption-matched counterexample — no fitted slopes</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(64,160)">
      <rect width="164" height="250" rx="16" fill="#146c5c"/>
      <text x="82" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="white">CLAIM 1</text>
      <text x="82" y="112" text-anchor="middle" font-size="18" fill="white">private MLE</text>
      <text x="82" y="145" text-anchor="middle" font-size="18" fill="white">log loss</text>
      <text x="82" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#d6fff4">VERIFIED</text>
    </g>
    <g transform="translate(246,160)">
      <rect width="164" height="250" rx="16" fill="#146c5c"/>
      <text x="82" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="white">CLAIM 2</text>
      <text x="82" y="112" text-anchor="middle" font-size="18" fill="white">squared</text>
      <text x="82" y="145" text-anchor="middle" font-size="18" fill="white">corruption</text>
      <text x="82" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#d6fff4">VERIFIED</text>
    </g>
    <g transform="translate(428,160)">
      <rect width="164" height="250" rx="16" fill="#146c5c"/>
      <text x="82" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="white">CLAIM 3</text>
      <text x="82" y="112" text-anchor="middle" font-size="18" fill="white">optimal</text>
      <text x="82" y="145" text-anchor="middle" font-size="18" fill="white">privacy cost</text>
      <text x="82" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#d6fff4">VERIFIED</text>
    </g>
    <g transform="translate(610,160)">
      <rect width="164" height="250" rx="16" fill="#146c5c"/>
      <text x="82" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="white">CLAIM 4</text>
      <text x="82" y="112" text-anchor="middle" font-size="18" fill="white">CTL versus</text>
      <text x="82" y="145" text-anchor="middle" font-size="18" fill="white">LTC order</text>
      <text x="82" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#d6fff4">VERIFIED</text>
    </g>
    <g transform="translate(792,160)">
      <rect width="164" height="250" rx="16" fill="#a13d2d"/>
      <text x="82" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="white">CLAIM 5</text>
      <text x="82" y="103" text-anchor="middle" font-size="17" fill="white">rate verifies;</text>
      <text x="82" y="134" text-anchor="middle" font-size="17" fill="white">“first” does not</text>
      <text x="82" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#ffe5df">FALSIFIED</text>
    </g>
    <g transform="translate(974,160)">
      <rect width="164" height="250" rx="16" fill="#146c5c"/>
      <text x="82" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="white">CLAIM 6</text>
      <text x="82" y="112" text-anchor="middle" font-size="18" fill="white">offline</text>
      <text x="82" y="145" text-anchor="middle" font-size="18" fill="white">rates</text>
      <text x="82" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#d6fff4">VERIFIED</text>
    </g>
  </g>
  <text x="64" y="474" font-family="Arial, sans-serif" font-size="19" fill="#17212b">Previous live judged score: 0/12</text>
  <text x="64" y="510" font-family="Arial, sans-serif" font-size="17" fill="#51606e">Verdicts shown are the reproduction’s evidence assessment, not a new live judge result.</text>
</svg>
