<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Finite-policy algorithm conformance and negative control</title>
  <desc id="desc">PrivChiPO selects A high by maximizing its score. SquareChiPO selects A low by minimizing its loss. PrivXPO selects A low with c squared scaling, while the negative control omitting c squared incorrectly selects A high.</desc>
  <rect width="1200" height="620" fill="#f7f5ef"/>
  <text x="64" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#17212b">Named algorithms make consequentially different choices</text>
  <text x="64" y="108" font-family="Arial, sans-serif" font-size="20" fill="#51606e">Fixed two-policy fixture; bars show objective magnitude, labels show exact values</text>
  <g font-family="Arial, sans-serif">
    <text x="90" y="173" font-size="22" font-weight="700" fill="#17212b">PrivχPO score (maximize)</text>
    <rect x="420" y="145" width="161" height="32" fill="#2166ac"/>
    <text x="592" y="169" font-size="17" fill="#17212b">A_high −0.671 ✓</text>
    <rect x="420" y="187" width="603" height="32" fill="#b9c3ca"/>
    <text x="1034" y="211" font-size="17" fill="#17212b">A_low −2.510</text>
    <text x="90" y="290" font-size="22" font-weight="700" fill="#17212b">SquareχPO loss (minimize)</text>
    <rect x="420" y="261" width="654" height="32" fill="#b9c3ca"/>
    <text x="1082" y="285" font-size="17" fill="#17212b">A_high 16.359</text>
    <rect x="420" y="303" width="104" height="32" fill="#2166ac"/>
    <text x="536" y="327" font-size="17" fill="#17212b">A_low 2.599 ✓</text>
    <text x="90" y="407" font-size="22" font-weight="700" fill="#17212b">PrivXPO objective (minimize)</text>
    <rect x="420" y="378" width="518" height="32" fill="#b9c3ca"/>
    <text x="950" y="402" font-size="17" fill="#17212b">A_high 2.590</text>
    <rect x="420" y="420" width="300" height="32" fill="#2166ac"/>
    <text x="732" y="444" font-size="17" fill="#17212b">A_low 1.500 ✓</text>
    <rect x="64" y="500" width="1072" height="70" rx="14" fill="#a13d2d"/>
    <text x="600" y="530" text-anchor="middle" font-size="20" font-weight="700" fill="white">Negative control: omit c(ε)² → selection flips to A_high</text>
    <text x="600" y="555" text-anchor="middle" font-size="17" fill="#ffe5df">The verifier exits nonzero, so the control cannot pass silently.</text>
  </g>
</svg>
